<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多專案追蹤報表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F6F3;--bg-card:#FFF;--bg-s:#F0EFEC;--bg-h:#E8E7E3;
  --t1:#1B1B18;--t2:#6B6B66;--t3:#9E9E97;
  --bd:rgba(0,0,0,.06);--bd2:rgba(0,0,0,.1);
  --blue:#3B82F6;--blue-bg:#EFF6FF;--blue-t:#1E40AF;
  --green:#22C55E;--green-bg:#F0FDF4;--green-t:#166534;
  --red:#EF4444;--red-bg:#FEF2F2;--red-t:#991B1B;
  --amber:#F59E0B;--amber-bg:#FFFBEB;--amber-t:#92400E;
  --purple:#8B5CF6;--purple-bg:#F5F3FF;--purple-t:#5B21B6;
  --teal:#14B8A6;--teal-bg:#F0FDFA;--teal-t:#115E59;
  --coral:#F97316;--coral-bg:#FFF7ED;--coral-t:#9A3412;
  --pink:#EC4899;--pink-bg:#FDF2F8;--pink-t:#9D174D;
  --r:12px;--r-lg:16px;--r-xl:20px;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 6px rgba(0,0,0,.04),0 2px 4px rgba(0,0,0,.06);
  --font:'Inter','Noto Sans TC',-apple-system,sans-serif;
  --mono:'JetBrains Mono','SF Mono',monospace;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#111110;--bg-card:#1C1C1A;--bg-s:#232320;--bg-h:#2A2A27;
  --t1:#EDEDEC;--t2:#A1A19A;--t3:#6B6B66;
  --bd:rgba(255,255,255,.06);--bd2:rgba(255,255,255,.1);
  --blue-bg:#172554;--blue-t:#93C5FD;--green-bg:#052E16;--green-t:#86EFAC;
  --red-bg:#450A0A;--red-t:#FCA5A5;--amber-bg:#451A03;--amber-t:#FCD34D;
  --purple-bg:#2E1065;--purple-t:#C4B5FD;--teal-bg:#042F2E;--teal-t:#5EEAD4;
  --coral-bg:#431407;--coral-t:#FDBA74;--pink-bg:#500724;--pink-t:#F9A8D4;
  --shadow:0 1px 3px rgba(0,0,0,.2);--shadow-md:0 4px 8px rgba(0,0,0,.3);
}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--t1);line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:2.5rem 2rem}

/* Project Switcher */
.proj-bar{display:flex;gap:10px;margin-bottom:2rem;overflow-x:auto;padding-bottom:4px}
.proj-card{flex-shrink:0;padding:14px 22px;border-radius:var(--r-lg);border:2px solid var(--bd);background:var(--bg-card);cursor:pointer;transition:all .2s;min-width:200px;box-shadow:var(--shadow)}
.proj-card:hover{border-color:var(--bd2);box-shadow:var(--shadow-md)}
.proj-card.active{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.proj-card .pc-name{font-size:15px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.proj-card .pc-sub{font-size:12px;color:var(--t3)}
.proj-card .pc-prog{display:flex;align-items:center;gap:10px;margin-top:10px}
.proj-card .pc-bar{flex:1;height:6px;border-radius:3px;background:var(--bg-s);overflow:hidden}
.proj-card .pc-fill{height:100%;border-radius:3px;transition:width .4s}
.proj-card .pc-pct{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.pc-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* Header */
.header{margin-bottom:2rem;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px}
.header-left h1{font-size:28px;font-weight:700;letter-spacing:-.5px;margin-bottom:4px}
.header-left p{font-size:15px;color:var(--t2)}
.header-badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 14px;border-radius:20px}
.hb-active{background:var(--green-bg);color:var(--green-t)}
.hb-active .pulse{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Update Bar */
.update-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;padding:12px 20px;background:var(--bg-card);border-radius:var(--r-lg);border:1px solid var(--bd);box-shadow:var(--shadow)}
.update-info{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--t2)}
.update-info .update-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.update-info .update-dot.live{background:var(--green);animation:pulse 2s infinite}
.update-info .update-dot.stale{background:var(--amber)}
.update-info .update-dot.err{background:var(--red)}
.update-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 20px;font-size:14px;font-weight:600;font-family:var(--font);color:#fff;background:var(--blue);border:none;border-radius:calc(var(--r) - 2px);cursor:pointer;transition:all .2s;white-space:nowrap}
.update-btn:hover{filter:brightness(1.1);box-shadow:0 2px 8px rgba(59,130,246,.3)}
.update-btn:active{transform:scale(.97)}
.update-btn.loading{opacity:.7;pointer-events:none}
.update-btn .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.update-toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:var(--r);font-size:14px;font-weight:500;z-index:999;box-shadow:var(--shadow-md);transition:all .3s;opacity:0;pointer-events:none}
.update-toast.show{opacity:1}
.update-toast.success{background:var(--green-bg);color:var(--green-t);border:1px solid var(--green)}
.update-toast.error{background:var(--red-bg);color:var(--red-t);border:1px solid var(--red)}
.update-toast.info{background:var(--blue-bg);color:var(--blue-t);border:1px solid var(--blue)}

/* Date Navigation */
.date-nav{display:flex;gap:6px;margin-bottom:2rem;padding:4px;background:var(--bg-s);border-radius:var(--r);width:fit-content;overflow-x:auto}
.date-btn{padding:10px 20px;font-size:14px;font-weight:500;cursor:pointer;border-radius:calc(var(--r) - 2px);border:none;background:transparent;color:var(--t2);transition:all .2s;font-family:var(--font);white-space:nowrap}
.date-btn:hover{color:var(--t1);background:var(--bg-h)}
.date-btn.active{background:var(--bg-card);color:var(--t1);font-weight:600;box-shadow:var(--shadow)}

/* Metric Cards */
.mets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:2rem}
.mc{background:var(--bg-card);border-radius:var(--r-lg);padding:1.25rem 1.5rem;box-shadow:var(--shadow);border:1px solid var(--bd);position:relative;overflow:hidden}
.mc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r-lg) var(--r-lg) 0 0}
.mc:nth-child(1)::before{background:var(--blue)}
.mc:nth-child(2)::before{background:var(--purple)}
.mc:nth-child(3)::before{background:var(--green)}
.mc:nth-child(4)::before{background:var(--red)}
.mc .lb{font-size:13px;color:var(--t2);font-weight:500;margin-bottom:8px;text-transform:uppercase;letter-spacing:.3px}
.mc .vl{font-size:32px;font-weight:700;letter-spacing:-1px;line-height:1.1}
.mc .df{font-size:12px;margin-top:6px;font-weight:500;display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px}
.df.up{color:var(--green-t);background:var(--green-bg)}
.df.dn{color:var(--red-t);background:var(--red-bg)}
.df.nt{color:var(--t3);background:var(--bg-s)}

/* Main Tabs */
.tab-wrap{background:var(--bg-card);border-radius:var(--r-xl);box-shadow:var(--shadow-md);border:1px solid var(--bd);overflow:hidden;margin-bottom:2rem}
.main-tabs{display:flex;border-bottom:1px solid var(--bd);overflow-x:auto;scrollbar-width:none}
.main-tabs::-webkit-scrollbar{display:none}
.mtab{padding:16px 24px;font-size:14px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--t2);border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;font-family:var(--font)}
.mtab:hover{color:var(--t1);background:var(--bg-s)}
.mtab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600;background:transparent}
.tab-body{padding:2rem}
.tc{display:none}.tc.active{display:block}

/* Sections */
.sec{margin-bottom:2.5rem}.sec:last-child{margin-bottom:0}
.st{font-size:17px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.st-dot{width:4px;height:20px;border-radius:2px;flex-shrink:0}

/* Progress Rows */
.pr-grid{display:flex;flex-direction:column;gap:2px;background:var(--bg-s);border-radius:var(--r);overflow:hidden}
.pr{display:flex;align-items:center;gap:16px;padding:14px 18px;background:var(--bg-card);transition:background .1s}
.pr:hover{background:var(--bg-s)}
.prn{flex:1;min-width:0}.prn .nm{font-size:14px;font-weight:500}.prn .ps{font-size:12px;color:var(--t3);margin-top:2px}
.prb{width:160px;flex-shrink:0}
.bar{height:6px;border-radius:3px;background:var(--bg-s);overflow:hidden}
.bf{height:100%;border-radius:3px;transition:width .5s}
.pp{width:44px;text-align:right;font-size:14px;font-weight:600;flex-shrink:0;font-variant-numeric:tabular-nums}
.badge{font-size:12px;padding:4px 12px;border-radius:8px;flex-shrink:0;text-align:center;min-width:68px;font-weight:600}
.b-done{background:var(--green-bg);color:var(--green-t)}
.b-prog{background:var(--blue-bg);color:var(--blue-t)}
.b-rev{background:var(--amber-bg);color:var(--amber-t)}
.b-todo{background:var(--bg-s);color:var(--t3)}
.b-blk{background:var(--red-bg);color:var(--red-t)}

/* Story Cards */
.story-grid{display:flex;flex-direction:column;gap:12px}
.story{background:var(--bg-card);border-radius:var(--r-lg);padding:1.5rem;border:1px solid var(--bd);transition:border-color .15s,box-shadow .15s}
.story:hover{border-color:var(--bd2);box-shadow:var(--shadow)}
.story-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.story-id{font-size:12px;font-weight:700;font-family:var(--mono);color:var(--blue-t);background:var(--blue-bg);padding:3px 10px;border-radius:6px}
.story-pri{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}
.pri-p0{background:var(--red-bg);color:var(--red-t)}
.pri-p1{background:var(--amber-bg);color:var(--amber-t)}
.story-title{font-size:16px;font-weight:600;margin-bottom:8px;line-height:1.4}
.story-desc{font-size:14px;color:var(--t2);line-height:1.7;margin-bottom:12px}
.story-foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.story-foot span{font-size:13px;color:var(--t3)}

/* Commit */
.commit-head{display:flex;gap:20px;flex-wrap:wrap;padding:16px 20px;background:var(--bg-s);border-radius:var(--r);margin-bottom:20px;font-size:14px;color:var(--t2);align-items:center}
.commit-head b{font-weight:700;color:var(--t1)}
.ch-add{color:var(--green-t)}.ch-del{color:var(--red-t)}
.commit-list{position:relative;padding-left:28px}
.commit-list::before{content:'';position:absolute;left:13px;top:24px;bottom:24px;width:2px;background:var(--bd);border-radius:1px}
.commit{position:relative;padding:16px 0;padding-left:28px}
.c-dot{position:absolute;left:-22px;top:22px;width:14px;height:14px;border-radius:50%;border:3px solid var(--bg-card);box-shadow:0 0 0 2px var(--bd2);z-index:1}
.c-card{background:var(--bg-card);border:1px solid var(--bd);border-radius:var(--r);padding:16px 20px;transition:border-color .15s,box-shadow .15s}
.c-card:hover{border-color:var(--bd2);box-shadow:var(--shadow)}
.c-msg{font-size:15px;font-weight:500;margin-bottom:10px;line-height:1.5;display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
.c-tag{font-size:11px;padding:3px 10px;border-radius:6px;font-weight:700;flex-shrink:0;text-transform:uppercase;letter-spacing:.3px}
.c-feat{background:var(--blue-bg);color:var(--blue-t)}
.c-fix{background:var(--red-bg);color:var(--red-t)}
.c-refactor{background:var(--purple-bg);color:var(--purple-t)}
.c-chore{background:var(--bg-s);color:var(--t2)}
.c-hotfix{background:var(--coral-bg);color:var(--coral-t)}
.c-perf{background:var(--teal-bg);color:var(--teal-t)}
.c-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--t2);align-items:center;margin-bottom:10px}
.c-time{font-family:var(--mono);font-weight:500;font-size:12px;color:var(--t3)}
.c-hash{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--blue-t);background:var(--blue-bg);padding:2px 8px;border-radius:6px}
.c-avatar{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;flex-shrink:0}
.c-author{display:flex;align-items:center;gap:6px;font-weight:500}
.c-files{display:flex;flex-direction:column;gap:4px;font-size:12px;font-family:var(--mono);padding:10px 14px;background:var(--bg-s);border-radius:8px;margin-top:10px}
.c-file-row{display:flex;align-items:center;gap:10px}
.c-fn{color:var(--t2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-fa{color:var(--green-t);font-weight:600;white-space:nowrap}
.c-fd{color:var(--red-t);font-weight:600;white-space:nowrap}

/* QA Table */
.qa-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--bd)}
.qa-table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.qa-table th{text-align:left;padding:12px 16px;font-weight:600;font-size:12px;color:var(--t2);background:var(--bg-s);border-bottom:1px solid var(--bd);text-transform:uppercase;letter-spacing:.3px}
.qa-table td{padding:12px 16px;border-bottom:1px solid var(--bd);vertical-align:middle}
.qa-table tbody tr:last-child td{border-bottom:none}
.qa-table tbody tr:hover td{background:var(--bg-s)}
.qa-r{font-size:12px;padding:4px 12px;border-radius:8px;font-weight:600;white-space:nowrap}
.qa-pass{background:var(--green-bg);color:var(--green-t)}
.qa-fail{background:var(--red-bg);color:var(--red-t)}
.qa-pend{background:var(--amber-bg);color:var(--amber-t)}

.footer{text-align:center;font-size:13px;color:var(--t3);padding:1.5rem 0 1rem;border-top:1px solid var(--bd);margin-top:1rem}

@media(max-width:768px){
  .wrap{padding:1.25rem 1rem}.header-left h1{font-size:22px}
  .mets{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.mc .vl{font-size:24px}.mc{padding:1rem}
  .tab-body{padding:1.25rem}.mtab{padding:12px 16px;font-size:13px}
  .prb{width:100px}.pp{width:38px;font-size:13px}.badge{min-width:56px;font-size:11px;padding:3px 8px}
  .date-nav{width:100%}.c-files{overflow-x:auto}.story{padding:1rem}
  .proj-card{min-width:160px;padding:12px 16px}
}
@media(max-width:480px){.mets{grid-template-columns:1fr 1fr}.pr{flex-wrap:wrap;gap:8px}.prb{width:100%;order:3}.pp{order:4}}
</style>
</head>

<noscript>

<div class="wrap">

  <div class="update-bar">

  <div class="header" id="headerArea"></div>

</div>

/* ============ STATE ============ */
let curProj='usdt', curDate='0506', curTab='product';

/* ============ HELPERS ============ */
const bc=p=>p>=100?'var(--green)':p>=70?'var(--blue)':p>=40?'var(--amber)':'#B4B2A9';
const bC=s=>({done:'b-done',prog:'b-prog',rev:'b-rev',todo:'b-todo',blk:'b-blk'})[s]||'b-todo';
const bL=s=>({done:'已完成',prog:'進行中',rev:'審核中',todo:'未開始',blk:'Blocked'})[s]||'未開始';
const sL=s=>({done:'已完成',prog:'開發中',rev:'待驗收',todo:'未開始'})[s]||'未開始';
const qC=r=>({pass:'qa-pass',fail:'qa-fail',pend:'qa-pend'})[r]||'qa-pend';
const qL=r=>({pass:'Pass',fail:'Fail',pend:'Pending'})[r]||'Pending';

function getProj(){ return projects[curProj]; }
function getDaily(){
  const p=getProj();
  if(p.daily[curDate]) return p.daily[curDate];
  const keys=Object.keys(p.daily);
  curDate=keys[keys.length-1];
  return p.daily[curDate];
}

/* ============ RENDER ============ */
function renderProjBar(){
  const el=document.getElementById('projBar');
  el.innerHTML=Object.entries(projects).map(([k,p])=>{
    const lastKey=Object.keys(p.daily).pop();
    const ov=p.daily[lastKey].ov;
    return `<div class="proj-card${k===curProj?' active':''}" onclick="pickProj('${k}')">
      <div class="pc-name"><span class="pc-dot" style="background:${p.color}"></span>${p.name}</div>
      <div class="pc-sub">${p.sub.split('｜')[0].trim()}</div>
      <div class="pc-prog"><div class="pc-bar"><div class="pc-fill" style="width:${ov}%;background:${p.color}"></div></div><div class="pc-pct">${ov}%</div></div>
    </div>`;
  }).join('');
}

function renderHeader(){
  const p=getProj();
  document.getElementById('headerArea').innerHTML=`
    <div class="header-left"><h1>${p.name}</h1><p>${p.sub}</p></div>
    <div class="header-badge hb-active"><span class="pulse"></span> 追蹤中</div>`;
}

function renderNav(){
  const p=getProj();
  document.getElementById('dateNav').innerHTML=p.dates.map(x=>`<button class="date-btn${x.key===curDate?' active':''}" onclick="pickDate('${x.key}')">${x.date}</button>`).join('');
}

function renderMet(){
  const d=getDaily();
  const diff=(v,dir)=>v?`<span class="df ${dir}">${v} vs 昨日</span>`:'<span class="df nt">首日基準</span>';
  document.getElementById('metCards').innerHTML=`
    <div class="mc"><div class="lb">整體進度</div><div class="vl" style="color:var(--blue)">${d.ov}%</div>${diff(d.dO,d.dO&&d.dO[0]==='+'?'up':'dn')}</div>
    <div class="mc"><div class="lb">User story</div><div class="vl">${d.st}</div>${diff(d.dS,'up')}</div>
    <div class="mc"><div class="lb">QA 通過</div><div class="vl">${d.qaS}</div>${diff(d.dQ,'up')}</div>
    <div class="mc"><div class="lb">未解決 bug</div><div class="vl" style="color:var(--red)">${d.bugs}</div>${diff(d.dB,d.dB&&d.dB[0]==='-'?'up':'dn')}<div class="df nt" style="margin-top:4px">${d.bugD}</div></div>`;
}

function progSec(title,color,items,showO,showSp){
  return `<div class="sec"><div class="st"><span class="st-dot" style="background:${color}"></span>${title}</div>
  <div class="pr-grid">${items.map(i=>`<div class="pr">
    <div class="prn"><div class="nm">${i.n}</div><div class="ps">${showO&&i.o?i.o:''}${showSp&&i.sp?' · '+i.sp:''}</div></div>
    <div class="prb"><div class="bar"><div class="bf" style="width:${i.p}%;background:${bc(i.p)}"></div></div></div>
    <div class="pp">${i.p}%</div><div class="badge ${bC(i.s)}">${bL(i.s)}</div>
  </div>`).join('')}</div></div>`;
}

function renderTab(){
  const d=getDaily(),b=document.getElementById('tabBody');
  if(curTab==='product'){
    b.innerHTML=`<div class="sec"><div class="st"><span class="st-dot" style="background:var(--purple)"></span>User story 清單</div>
    <div class="story-grid">${d.product.map(s=>`<div class="story">
      <div class="story-top"><span class="story-id">${s.id}</span><span class="story-pri pri-${s.pri.toLowerCase()}">${s.pri}</span><span class="badge ${bC(s.s)}" style="margin-left:auto">${sL(s.s)}</span></div>
      <div class="story-title">${s.t}</div>
      <div class="story-desc">${s.d}</div>
      <div class="story-foot"><span>驗收標準：${s.ac} 項</span></div>
    </div>`).join('')}</div></div>
    ${progSec('產品里程碑','var(--amber)',d.ms,false,false)}`;
  } else if(curTab==='design'){
    b.innerHTML=progSec('UI/UX 設計進度','var(--pink)',d.design,true,false);
  } else if(curTab==='frontend'){
    b.innerHTML=progSec('前端開發進度','var(--green)',d.fe,true,true);
  } else if(curTab==='backend'){
    b.innerHTML=progSec('後端開發進度','var(--teal)',d.be,true,false);
  } else if(curTab==='qa'){
    const all=d.qaT.flatMap(g=>g.items);
    const ps=all.filter(i=>i.r==='pass').length,fl=all.filter(i=>i.r==='fail').length,pd=all.filter(i=>i.r==='pend').length;
    b.innerHTML=`<div class="mets" style="margin-bottom:1.5rem">
      <div class="mc"><div class="lb">測試案例</div><div class="vl">${all.length}</div></div>
      <div class="mc"><div class="lb">通過</div><div class="vl" style="color:var(--green)">${ps}</div></div>
      <div class="mc"><div class="lb">失敗</div><div class="vl" style="color:var(--red)">${fl}</div></div>
      <div class="mc"><div class="lb">待測</div><div class="vl" style="color:var(--amber)">${pd}</div></div>
    </div>
    ${d.qaT.map(g=>`<div class="sec"><div class="st"><span class="st-dot" style="background:var(--blue)"></span>${g.sec}</div>
    <div class="qa-wrap"><table class="qa-table"><thead><tr><th style="width:90px">編號</th><th style="width:120px">測試項目</th><th>測試內容</th><th style="width:90px">結果</th></tr></thead>
    <tbody>${g.items.map(i=>`<tr>
      <td style="font-family:var(--mono);font-weight:600;font-size:13px">${i.id}</td>
      <td style="font-weight:500">${i.n}</td>
      <td style="color:var(--t2)">${i.d}</td>
      <td><span class="qa-r ${qC(i.r)}">${qL(i.r)}</span></td>
    </tr>`).join('')}</tbody></table></div></div>`).join('')}`;
  } else if(curTab==='commits'){
    const cs=d.commits||[];
    const tA=cs.reduce((s,c)=>s+c.f.reduce((a,f)=>a+f.a,0),0);
    const tD=cs.reduce((s,c)=>s+c.f.reduce((a,f)=>a+f.d,0),0);
    const tF=cs.reduce((s,c)=>s+c.f.length,0);
    b.innerHTML=`<div class="commit-head">
      <span><b>${cs.length}</b> commits</span><span><b>${tF}</b> files</span>
      <span class="ch-add"><b>+${tA}</b></span><span class="ch-del"><b>-${tD}</b></span>
    </div>
    <div class="commit-list">${cs.map(c=>`<div class="commit">
      <div class="c-dot" style="background:${c.c}"></div>
      <div class="c-card">
        <div class="c-msg"><span class="c-tag c-${c.tp}">${c.tp}</span><span>${c.m}</span></div>
        <div class="c-meta"><span class="c-time">${c.t}</span><span class="c-hash">${c.h}</span><span class="c-author"><span class="c-avatar" style="background:${c.c}">${c.av}</span>${c.a}</span></div>
        <div class="c-files">${c.f.map(f=>`<div class="c-file-row"><span class="c-fn">${f.n}</span><span class="c-fa">+${f.a}</span><span class="c-fd">-${f.d}</span></div>`).join('')}</div>
      </div>
    </div>`).join('')}</div>`;
  }
}

/* ============ ACTIONS ============ */
function pickProj(k){
  curProj=k;
  const p=getProj();
  const lastKey=Object.keys(p.daily).pop();
  curDate=lastKey;
  curTab='product';
  document.querySelectorAll('.mtab').forEach((t,i)=>{t.classList.toggle('active',i===0)});
  renderAll();
}
function pickDate(k){curDate=k;renderMet();renderTab();}
function renderAll(){renderProjBar();renderHeader();renderNav();renderMet();renderTab();}

document.getElementById('mainTabs').addEventListener('click',e=>{
  if(!e.target.classList.contains('mtab'))return;
  document.querySelectorAll('.mtab').forEach(t=>t.classList.remove('active'));
  e.target.classList.add('active');curTab=e.target.dataset.tab;renderTab();
});

/* ============ DATA FETCH ============ */
function showToast(msg, type='info', duration=3000){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='update-toast '+type+' show';
  setTimeout(()=>t.classList.remove('show'), duration);
}

function setUpdateUI(state, msg){
  const dot=document.getElementById('updateDot');
  const time=document.getElementById('updateTime');
  dot.className='update-dot '+ (state==='live'?'live':state==='err'?'err':'stale');
  time.textContent=msg;
}

function setBtnLoading(loading){
  const btn=document.getElementById('updateBtn');
  if(loading){
    btn.classList.add('loading');
    btn.innerHTML='<span class="spin"></span> 拉取中...';
  } else {
    btn.classList.remove('loading');
    btn.innerHTML='<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 1v5h5"/><path d="M2.5 10A6 6 0 1 0 3.8 4L1 6"/></svg> 更新數據';
  }
}

async function fetchData(){
  setBtnLoading(true);
  setUpdateUI('stale','正在拉取最新數據...');

  try {
    const res = await fetch('data.json?t='+Date.now());
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();

    if(!data.projects || Object.keys(data.projects).length===0){
      throw new Error('data.json 內容為空');
    }

    // 用新資料覆蓋
    Object.keys(projects).forEach(k=> delete projects[k]);
    Object.assign(projects, data.projects);

    // 重設到第一個專案的最新日期
    const firstKey = Object.keys(projects)[0];
    curProj = firstKey;
    const p = projects[firstKey];
    curDate = Object.keys(p.daily).pop();
    curTab = 'product';
    document.querySelectorAll('.mtab').forEach((t,i)=>t.classList.toggle('active',i===0));

    // 更新時間顯示
    const updatedAt = data.lastUpdated
      ? new Date(data.lastUpdated).toLocaleString('zh-TW')
      : new Date().toLocaleString('zh-TW');
    setUpdateUI('live', '資料更新於 '+updatedAt);
    document.getElementById('footerArea').textContent='Dashboard — 資料來源：data.json · 更新於 '+updatedAt;

    renderAll();
    showToast('數據更新成功！已載入 '+Object.keys(projects).length+' 個專案', 'success');

  } catch(e) {
    console.error('Fetch error:', e);
    setUpdateUI('err','更新失敗');

    if(e.message.includes('404') || e.message.includes('Failed to fetch')){
      showToast('找不到 data.json — 請先設定資料收集排程（詳見產品文檔）', 'error', 5000);
    } else {
      showToast('更新失敗：'+e.message, 'error', 4000);
    }
  } finally {
    setBtnLoading(false);
  }
}

renderAll();
